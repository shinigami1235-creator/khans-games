<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Khan&#39;s Games</title>
<meta name="description" content="Khan&#39;s Games &mdash; three games in one file. Pick one and play.">
<meta name="theme-color" content="#101318">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Khan's Games">
<link rel="icon" href="./favicon.png" type="image/png">
<style>
:root{--bg:#101318;--card:#171C23;--line:#232B34;--ink:#E7ECF1;--mut:#7E8B98}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  -webkit-user-select:none; user-select:none; overscroll-behavior:none;
}

/* ---- menu ---- */
#menu{
  min-height:100%; max-width:760px; margin:0 auto;
  padding:calc(26px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right))
          calc(34px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));
}
@media (min-width:680px){
  .list{display:grid; grid-template-columns:1fr 1fr; gap:12px}
  .card{align-items:flex-start}
}
@media (min-width:1024px){ #menu{max-width:900px} .list{grid-template-columns:repeat(3,1fr)} }
.head{margin-bottom:22px}
h1{font-size:clamp(24px,7vw,34px); font-weight:600; letter-spacing:-.01em}
.sub{margin-top:6px; font-size:14px; color:var(--mut); line-height:1.6}
.list{display:flex; flex-direction:column; gap:10px}

.card{
  display:flex; align-items:center; gap:14px; min-height:82px; width:100%; text-align:left;
  background:var(--card); border:1px solid var(--line); border-left:3px solid var(--a);
  border-radius:12px; padding:13px 14px; color:inherit; font:inherit; cursor:pointer;
}
.card:hover{border-color:var(--a); border-left-color:var(--a); background:#1B212A}
.card:active{transform:scale(.995)}
.art{flex:0 0 auto; width:68px; height:48px; background:#0C1014; border-radius:8px;
     display:flex; align-items:center; justify-content:center; overflow:hidden}
.art img{width:68px; height:48px; display:block; object-fit:contain;
     image-rendering:pixelated; image-rendering:crisp-edges}
.body{flex:1 1 auto; min-width:0; display:flex; flex-direction:column; gap:3px}
.title{font-size:17px; font-weight:600}
.blurb{font-size:13px; color:var(--mut); line-height:1.5}
.tag{font-size:11px; letter-spacing:.12em; color:var(--b); font-weight:600; margin-top:3px}
.go{flex:0 0 auto; color:var(--mut); font-size:13px}
.card:hover .go{color:var(--a)}
.share{display:flex; flex-wrap:wrap; gap:9px; margin-top:20px}
.share a,.share button{
  font:inherit; font-size:13px; color:var(--ink); text-decoration:none;
  background:var(--card); border:1px solid var(--line); border-radius:9px;
  padding:10px 14px; cursor:pointer; display:inline-flex; align-items:center; gap:7px;
}
.share a:hover,.share button:hover{border-color:#3A4550; background:#1B212A}
.share .hint{color:var(--mut); font-size:12px}
.foot{margin-top:18px; font-size:12px; color:#5C6774; line-height:1.7}

/* ---- player ---- */
#player{display:none; position:fixed; inset:0; background:var(--bg); flex-direction:column}
#player.on{display:flex}
#bar{
  flex:0 0 auto; height:calc(46px + env(safe-area-inset-top));
  padding-top:env(safe-area-inset-top); display:flex; align-items:center; gap:12px;
  padding:0 12px; border-bottom:1px solid var(--line); background:#0C1014;
}
#back{
  font:inherit; font-size:13px; color:var(--ink); background:transparent;
  border:1px solid var(--line); border-radius:7px; padding:6px 12px; cursor:pointer;
}
#back:hover{border-color:#3A4550}
#now{font-size:13px; color:var(--mut); letter-spacing:.06em}
#frame{flex:1 1 auto; width:100%; border:0; display:block; background:var(--bg);
  padding-bottom:env(safe-area-inset-bottom)}
</style>
</head>
<body>

var menu=document.getElementById('menu'),
    player=document.getElementById('player'),
    frame=document.getElementById('frame'),
    now=document.getElementById('now');

function decode(b64){
  var bin=atob(b64), bytes=new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
  try{ return new TextDecoder('utf-8').decode(bytes); }
  catch(e){ return bin; }
}
function open(id,title){
  var html=BLOBS[id];
  if(!html)return;
  frame.srcdoc=decode(html);
  now.textContent=title;
  player.classList.add('on');
  menu.style.display='none';
  document.title=title;
  frame.addEventListener('load',function once(){
    frame.removeEventListener('load',once);
    try{ frame.contentWindow.focus(); }catch(e){}
  });
}
function close(){
  player.classList.remove('on');
  menu.style.display='';
  frame.srcdoc='';
  now.textContent='';
  document.title="Khan's Games";
  window.scrollTo(0,0);
}
Array.prototype.forEach.call(document.querySelectorAll('.card'),function(c){
  c.addEventListener('click',function(){
    open(c.getAttribute('data-game'), c.getAttribute('data-title'));
  });
});
document.getElementById('back').addEventListener('click',close);

// download / share
var dl=document.getElementById('dl'), sh=document.getElementById('sh'),
    cp=document.getElementById('cp'), note=document.getElementById('footnote');
dl.href=location.href;
var online=location.protocol==='http:'||location.protocol==='https:';
if(!online){
  note.textContent='You are running this from a saved file, so it already works offline. Send the file itself to share it.';
  cp.hidden=true;
}
if(navigator.share&&online)sh.hidden=false;
sh.addEventListener('click',function(){
  navigator.share({title:"Khan's Games",text:'Three games, no install.',url:location.href}).catch(function(){});
});
cp.addEventListener('click',function(){
  var done=function(){cp.textContent='Copied';setTimeout(function(){cp.innerHTML='&#128203;&nbsp; Copy link';},1600);};
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(location.href).then(done,function(){prompt('Copy this link',location.href);});
  }else{prompt('Copy this link',location.href);}
});
window.addEventListener('keydown',function(e){
  if(e.code==='Escape'&&player.classList.contains('on'))close();
});
// keyboard games need the frame focused; a tap anywhere in it restores that
document.addEventListener('pointerdown',function(){
  if(player.classList.contains('on')){ try{ frame.contentWindow.focus(); }catch(e){} }
});

// offline + home-screen install
if('serviceWorker' in navigator && location.protocol.indexOf('http')===0){
  window.addEventListener('load',function(){
    navigator.serviceWorker.register('./service-worker.js').catch(function(){});
  });
}
})();
</script>
